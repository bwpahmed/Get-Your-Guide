name: Claude SEO Readiness and Audit
on:
  workflow_dispatch:
    inputs:
      run_audit: {description: "Run Claude-powered audit", required: true, default: false, type: boolean}
      site_url: {description: "Live URL; blank uses SEO_SITE_URL", required: false, type: string}
      mode: {description: "SEO command", required: true, default: audit, type: choice, options: [audit, technical, page, schema, geo, content, local, images]}
  schedule: [{cron: "23 3 * * 1"}]
  push:
    paths: [".claude-seo.lock", "SEO_WORKFLOW.md", "scripts/install-claude-seo.sh", "scripts/install-claude-seo.ps1", ".github/workflows/claude-seo-audit.yml"]
permissions: {contents: read}
env: {CLAUDE_SEO_TAG: v2.3.1, CLAUDE_SEO_COMMIT: 55c7914a3ed2869b217b5d5f360a4e7ba28b4848}
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: bash scripts/install-claude-seo.sh
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_audit }}
    needs: readiness
    runs-on: ubuntu-latest
    env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}", SEO_SITE_URL: "${{ vars.SEO_SITE_URL }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --global @anthropic-ai/claude-code
      - run: bash scripts/install-claude-seo.sh
      - id: target
        shell: bash
        run: |
          url="${{ inputs.site_url }}"; [[ -n "$url" ]] || url="${SEO_SITE_URL:-}"; [[ -n "$url" ]] || exit 2; [[ -n "${ANTHROPIC_API_KEY:-}" ]] || exit 3; echo "url=$url" >> "$GITHUB_OUTPUT"
      - shell: bash
        run: |
          mkdir -p seo-reports; claude -p "/seo ${{ inputs.mode }} ${{ steps.target.outputs.url }}\nAudit only; do not edit repository files. Return Markdown with evidence and P0/P1/P2 actions." --output-format text --max-turns 30 --allowedTools "Bash(*)" "WebFetch" "WebSearch" "Read" "Task" "Agent" --disallowedTools "Edit" "Write" > "seo-reports/${{ inputs.mode }}.md"
      - uses: actions/upload-artifact@v4
        with: {name: "claude-seo-${{ inputs.mode }}-${{ github.run_id }}", path: seo-reports/, if-no-files-found: error}
