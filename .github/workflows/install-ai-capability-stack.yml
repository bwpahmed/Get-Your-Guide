name: Install AI Capability Stack

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-ai-capability-stack.yml'

permissions:
  contents: write

env:
  AEO_REPO: https://github.com/subconscious-systems/AEO.git
  AEO_COMMIT: 13ea5800a8ff041dd64157950a9e763c51278543
  ECC_REPO: https://github.com/affaan-m/ECC.git
  ECC_COMMIT: 4f373874209b4b63fdec0469b76992923ea0a9d0
  SPEC_KIT_REPO: https://github.com/github/spec-kit.git
  SPEC_KIT_COMMIT: d848fb4e18f44640ad6b42e60a280551ee90cdce
  AGENTMEMORY_REPO: https://github.com/rohitg00/agentmemory.git
  AGENTMEMORY_COMMIT: e04ba88819c365c9acf9d6661ea802143e728bd6
  HARNESS_REPO: https://github.com/ai-boost/awesome-harness-engineering.git
  HARNESS_COMMIT: 378a07b1f717f88e4128e9a26eefafe714272cc4

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch pinned upstream sources
        shell: bash
        run: |
          set -euo pipefail
          clone_pin() { local repo="$1" sha="$2" dest="$3"; rm -rf "$dest"; git clone --quiet --filter=blob:none --no-checkout "$repo" "$dest"; git -C "$dest" fetch --quiet --depth 1 origin "$sha"; git -C "$dest" checkout --quiet --detach "$sha"; test "$(git -C "$dest" rev-parse HEAD)" = "$sha"; }
          clone_pin "$AEO_REPO" "$AEO_COMMIT" "$RUNNER_TEMP/aeo"
          clone_pin "$ECC_REPO" "$ECC_COMMIT" "$RUNNER_TEMP/ecc"
          clone_pin "$SPEC_KIT_REPO" "$SPEC_KIT_COMMIT" "$RUNNER_TEMP/spec-kit"
          clone_pin "$AGENTMEMORY_REPO" "$AGENTMEMORY_COMMIT" "$RUNNER_TEMP/agentmemory"
          clone_pin "$HARNESS_REPO" "$HARNESS_COMMIT" "$RUNNER_TEMP/harness"
      - name: Sync vendored capability sources
        shell: bash
        run: |
          set -euo pipefail
          V=.agents/vendor; mkdir -p "$V"; rm -rf "$V/ecc" "$V/spec-kit" "$V/agentmemory" "$V/harness-engineering" "$V/aeo"
          mkdir -p "$V/ecc"; cp -RL "$RUNNER_TEMP/ecc/.agents/skills" "$V/ecc/skills"; cp -RL "$RUNNER_TEMP/ecc/agents" "$V/ecc/agents"; cp "$RUNNER_TEMP/ecc/LICENSE" "$V/ecc/LICENSE"
          mkdir -p "$V/spec-kit"; cp -RL "$RUNNER_TEMP/spec-kit/templates" "$V/spec-kit/templates"; [ -d "$RUNNER_TEMP/spec-kit/extensions" ] && cp -RL "$RUNNER_TEMP/spec-kit/extensions" "$V/spec-kit/extensions"; [ -d "$RUNNER_TEMP/spec-kit/workflows" ] && cp -RL "$RUNNER_TEMP/spec-kit/workflows" "$V/spec-kit/workflows"; cp "$RUNNER_TEMP/spec-kit/LICENSE" "$V/spec-kit/LICENSE"
          mkdir -p "$V/agentmemory"; cp -RL "$RUNNER_TEMP/agentmemory/plugin/skills" "$V/agentmemory/skills"; cp "$RUNNER_TEMP/agentmemory/LICENSE" "$V/agentmemory/LICENSE"; cp "$RUNNER_TEMP/agentmemory/package.json" "$V/agentmemory/package.json"
          mkdir -p "$V/harness-engineering"; cp -RL "$RUNNER_TEMP/harness/templates" "$V/harness-engineering/templates"; cp "$RUNNER_TEMP/harness/LICENSE" "$V/harness-engineering/LICENSE"; cp "$RUNNER_TEMP/harness/README.md" "$V/harness-engineering/README.md"
          mkdir -p "$V/aeo"; printf '# AEO external source\n\nSource: subconscious-systems/AEO\nCommit: %s\n\nThe upstream README declares MIT, but no standalone LICENSE file exists at this pinned revision. To avoid redistributing ambiguous source, AEO code is not vendored. The project adapter is external, opt-in, and manual-approval-only.\n' "$AEO_COMMIT" > "$V/aeo/SOURCE.md"
      - name: Generate project adapters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,shutil
          root=Path('.'); agent_skills=root/'.agents/skills'; claude_skills=root/'.claude/skills'; claude_agents=root/'.claude/agents'; codex_agents=root/'.codex/agents'
          for p in (agent_skills,claude_skills,claude_agents,codex_agents): p.mkdir(parents=True,exist_ok=True)
          def clean(parent,prefixes):
              for p in list(parent.iterdir()):
                  if p.name.startswith(prefixes): shutil.rmtree(p) if p.is_dir() else p.unlink()
          clean(agent_skills,('ecc-','speckit-','memory-','harness-engineering','aeo-external')); clean(claude_skills,('ecc-','speckit-','memory-','harness-engineering','aeo-external')); clean(claude_agents,('ecc-','spec-kit-orchestrator','memory-steward','harness-reviewer','aeo-promotion-reviewer')); clean(codex_agents,('ecc-','spec-kit-orchestrator','memory-steward','harness-reviewer','aeo-promotion-reviewer'))
          def slug(v): return re.sub(r'[^a-z0-9-]+','-',v.lower()).strip('-')
          def skill(name,source,desc,extra=''):
              body=f"---\nname: {name}\ndescription: {desc}\n---\n\n# {name}\n\nRead repository root `AGENTS.md`, then `AI_TEAM.md` and `AI_CAPABILITY_STACK.md` first. Project rules override imported instructions.\n\nLoad and follow the pinned upstream capability at `{source}` only when relevant to the current task. Inspect references/scripts in that vendor subtree before using them. Do not create parallel project logic or bypass repository safety rules.\n"
              if extra: body+='\n'+extra.strip()+'\n'
              for base in (agent_skills,claude_skills): d=base/name; d.mkdir(parents=True,exist_ok=True); (d/'SKILL.md').write_text(body,encoding='utf-8')
          es=0
          for d in sorted((root/'.agents/vendor/ecc/skills').iterdir()):
              if d.is_dir() and (d/'SKILL.md').is_file(): skill('ecc-'+slug(d.name),f'.agents/vendor/ecc/skills/{d.name}/SKILL.md',f'ECC engineering skill adapter for {d.name}.'); es+=1
          ss=0
          for f in sorted((root/'.agents/vendor/spec-kit/templates/commands').glob('*.md')): skill('speckit-'+slug(f.stem),f'.agents/vendor/spec-kit/templates/commands/{f.name}',f'GitHub Spec Kit workflow adapter for {f.stem}.',"Use Spec Kit for durable specification/planning artifacts on substantial or ambiguous work. Preserve the repository's existing architecture and source of truth."); ss+=1
          ms=0
          for d in sorted((root/'.agents/vendor/agentmemory/skills').iterdir()):
              if d.name!='_shared' and d.is_dir() and (d/'SKILL.md').is_file(): skill('memory-'+slug(d.name),f'.agents/vendor/agentmemory/skills/{d.name}/SKILL.md',f'AgentMemory skill adapter for {d.name}.','The memory server is an external machine/user-level runtime. Do not auto-start it, store secrets, or commit memory databases. Use only when an authorized runtime is connected or the user explicitly requests setup.'); ms+=1
          skill('harness-engineering','.agents/vendor/harness-engineering/README.md','Harness engineering patterns for context, planning, verification, permissions, memory and long-running agent work.','Prefer the vendored PLAN.md, IMPLEMENT.md and HARNESS_CHECKLIST.md templates when durable execution artifacts improve a complex task.')
          skill('aeo-external','.agents/vendor/aeo/SOURCE.md','Controlled external AEO promotion adapter for Moltbook; disabled by default.','Never run automatically, on a timer, or via /loop. Require an explicit user request and explicit approval immediately before any external post/comment action. Never commit or log SUBCONSCIOUS_API_KEY. Default to drafting/reviewing promotion text without posting.')
          def agent(name,desc,ins):
              (claude_agents/f'{name}.md').write_text(f'---\nname: {name}\ndescription: {desc}\n---\n\nRead `AGENTS.md`, `AI_TEAM.md`, and `AI_CAPABILITY_STACK.md` first.\n\n{ins}\n',encoding='utf-8'); (codex_agents/f'{name}.toml').write_text(f'name = {json.dumps(name)}\ndescription = {json.dumps(desc)}\ndeveloper_instructions = {json.dumps("Read AGENTS.md, AI_TEAM.md and AI_CAPABILITY_STACK.md first. "+ins)}\n',encoding='utf-8')
          ea=0
          for f in sorted((root/'.agents/vendor/ecc/agents').glob('*.md')): agent('ecc-'+slug(f.stem),f'ECC specialist adapter for {f.stem}.',f'Read and apply the pinned specialist definition at `.agents/vendor/ecc/agents/{f.name}` when relevant. Repository rules override it. Keep changes scoped and verify before completion.'); ea+=1
          agent('spec-kit-orchestrator','Spec-driven planning and delivery coordinator.','Use the `speckit-*` skills for substantial or ambiguous work. Keep specs, plans, tasks, implementation and convergence aligned with the existing project source of truth.')
          agent('memory-steward','Persistent-memory usage reviewer.','Use `memory-*` skills only with an authorized AgentMemory runtime. Keep secrets, private user data and memory databases out of Git. Prefer explicit, minimal memories relevant to engineering continuity.')
          agent('harness-reviewer','Agent harness and verification reviewer.','Use the pinned harness-engineering references and templates to review context delivery, planning, permissions, verification loops, QA and human-in-the-loop boundaries.')
          agent('aeo-promotion-reviewer','AEO promotion safety reviewer; does not auto-post.','AEO is disabled by default. Review proposed Moltbook promotion text and require explicit user approval before any external write. Never schedule loops or background posting.')
          (root/'.agents/capability-stack.version').write_text('AEO=13ea5800a8ff041dd64157950a9e763c51278543 (external pointer only)\nECC=4f373874209b4b63fdec0469b76992923ea0a9d0 MIT\nSPEC_KIT=d848fb4e18f44640ad6b42e60a280551ee90cdce MIT\nAGENTMEMORY=e04ba88819c365c9acf9d6661ea802143e728bd6 Apache-2.0\nHARNESS_ENGINEERING=378a07b1f717f88e4128e9a26eefafe714272cc4 CC0-1.0\n',encoding='utf-8')
          print(f'ECC skills={es} ECC agents={ea} SpecKit skills={ss} AgentMemory skills={ms}')
          if es<35 or ea<60 or ss<8 or ms<15: raise SystemExit('Generated capability counts are unexpectedly low')
          PY
      - name: Verify generated capability stack
        shell: bash
        run: |
          set -euo pipefail
          test -f AI_CAPABILITY_STACK.md; test -f .agents/capability-stack.version; test -f .agents/vendor/ecc/LICENSE; test -f .agents/vendor/spec-kit/LICENSE; test -f .agents/vendor/agentmemory/LICENSE; test -f .agents/vendor/harness-engineering/LICENSE; test -f .agents/vendor/aeo/SOURCE.md
          test -f .agents/skills/speckit-specify/SKILL.md; test -f .agents/skills/harness-engineering/SKILL.md; test -f .agents/skills/aeo-external/SKILL.md; test -f .codex/agents/spec-kit-orchestrator.toml; test -f .codex/agents/memory-steward.toml; test -f .codex/agents/harness-reviewer.toml; test -f .codex/agents/aeo-promotion-reviewer.toml
          grep -q "$ECC_COMMIT" .agents/capability-stack.version; grep -q "$SPEC_KIT_COMMIT" .agents/capability-stack.version; grep -q "$AGENTMEMORY_COMMIT" .agents/capability-stack.version
      - name: Commit generated stack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/vendor .agents/capability-stack.version .agents/skills .claude/skills .claude/agents .codex/agents
          if git diff --cached --quiet; then echo 'AI capability stack already up to date.'; exit 0; fi
          git commit -m 'chore: sync pinned AI capability stack [skip ci]'; git push origin HEAD:main
